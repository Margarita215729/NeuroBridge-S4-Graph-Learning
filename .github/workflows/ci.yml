name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run test suite
        run: python -m pytest --quiet

  container-smoke:
    name: Linux container smoke test
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Linux image
        run: docker build --tag neurobridge-s4:ci .

      - name: Verify dashboard health endpoint
        run: scripts/container_smoke_test.sh neurobridge-s4:ci
